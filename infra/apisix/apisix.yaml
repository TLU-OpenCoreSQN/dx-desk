# Template rendered by dxdesk.mjs after syncing Keycloak's public signing key.
# No private keys or client secrets. See ADR 0009 for key rotation.
routes:
  - id: healthz
    uri: /healthz
    plugins:
      mocking:
        content_type: text/plain
        response_example: ok
  - id: rest
    uri: /rest/*
    plugins:
      openid-connect: &verify-jwt
        client_id: __DXDESK_AUDIENCE__
        discovery: http://keycloak:8080/realms/dxdesk/.well-known/openid-configuration
        bearer_only: true
        public_key: __DXDESK_PUBLIC_KEY__
        token_signing_alg_values_expected: RS256
        accept_none_alg: false
        accept_unsupported_alg: false
        set_access_token_header: false
        set_id_token_header: false
        set_userinfo_header: false
        claim_validator:
          issuer:
            valid_issuers: [__DXDESK_ISSUER__]
          audience:
            required: true
            match_with_client_id: true
      limit-req: &request-limit
        rate: 30
        burst: 10
        key_type: var
        key: remote_addr
        rejected_code: 429
        rejected_msg: '{"statusCode":429,"message":"Vượt quá tần suất cho phép, vui lòng thử lại sau."}'
      proxy-rewrite:
        regex_uri: ["^/rest/(.*)", "/$1"]
    upstream:
      type: roundrobin
      nodes:
        "postgrest:3000": 1
  - id: attachment-content
    uri: /api/attachments/*
    priority: 40
    vars:
      - ["uri", "~~", "^/api/attachments/[0-9a-fA-F-]{36}/content$"]
    plugins:
      limit-req: *request-limit
    upstream:
      type: roundrobin
      nodes:
        "api:3000": 1
  - id: n8n-webhook
    uri: /webhook/*
    upstream:
      type: roundrobin
      nodes:
        "n8n:5678": 1
  - id: api-health
    uri: /api/health
    upstream:
      type: roundrobin
      nodes:
        "api:3000": 1
  - id: service-desk-api
    uri: /api/*
    priority: 20
    plugins:
      openid-connect: *verify-jwt
      limit-req: *request-limit
    upstream:
      type: roundrobin
      nodes:
        "api:3000": 1
  - id: web
    uri: /*
    priority: -10
    upstream:
      type: roundrobin
      nodes:
        "web:80": 1
#END
