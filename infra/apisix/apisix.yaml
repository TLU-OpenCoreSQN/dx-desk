# Route của cổng API. Tuần 2: chỉ định tuyến; token được chuyển nguyên vẹn xuống PostgREST
# (PostgREST tự kiểm tra chữ ký). Tuần 3 (W3-07) bổ sung openid-connect, giới hạn tần suất, nhật ký.
#
# Rà soát W3-07 cho PATCH /api/tickets/:id/status:
# - Không route nào khai báo `methods`, nên APISIX chấp nhận mọi HTTP method, kể cả PATCH;
#   endpoint mới đi đúng route service-desk-api mà không cần khai báo gì thêm.
# - Chữ ký token Keycloak được kiểm ngay tại cổng bằng openid-connect chế độ
#   bearer_only + use_jwks. Không dùng jwt-auth vì jwt-auth yêu cầu consumer do APISIX
#   tự cấp; ở đây Keycloak là bên phát hành token (xem Apache APISIX discussion #13571
#   và hướng dẫn keycloak-oidc chính thức trong tài liệu APISIX).
# - Phân quyền theo vai trò (Employee/Agent/Manager) vẫn do tầng API và RLS quyết định
#   (ADR 0002, ADR 0003); cổng chỉ chặn token giả hoặc hết hạn và giới hạn tần suất.
# - Nhật ký yêu cầu: access log bật mặc định trong image APISIX (logs/access.log trong
#   container). Cách xem: `docker compose logs apisix` và `docker compose exec apisix
#   cat /usr/local/apisix/logs/access.log` (hướng dẫn ở docs/cai-dat.md).
# Nghiệm thu runtime các plugin mới (401/429 thật) chờ CI/stack Docker; máy phát triển
# chưa có Docker nên chỉ kiểm được sơ đồ YAML và cấu trúc giống hệt tuần 2.
routes:
  - id: healthz
    uri: /healthz
    plugins:
      mocking:
        content_type: text/plain
        response_example: ok

  - id: rest
    uri: /rest/*
    plugins:
      proxy-rewrite:
        regex_uri: ["^/rest/(.*)", "/$1"]
    upstream:
      type: roundrobin
      nodes:
        "postgrest:3000": 1

  - id: n8n-webhook
    uri: /webhook/*
    upstream:
      type: roundrobin
      nodes:
        "n8n:5678": 1

  - id: api-health
    uri: /api/health
    # /api/health là endpoint không chứa dữ liệu nghiệp vụ, được healthcheck của
    # compose và harness CI gọi khi chưa có token. Route khớp chính xác này có
    # priority mặc định 10000 nên thắng /api/* (20) và không bị openid-connect chặn.
    upstream:
      type: roundrobin
      nodes:
        "api:3000": 1

  - id: service-desk-api
    uri: /api/*
    priority: 20
    plugins:
      openid-connect:
        client_id: dxdesk-api
        # schema bắt buộc có client_secret; chế độ bearer_only + use_jwks chỉ kiểm chữ ký
        # qua JWKS của Keycloak nên giá trị này không dùng đến trong luồng nghiệp vụ.
        client_secret: standalone-unused
        discovery: http://keycloak:8080/realms/dxdesk/.well-known/openid-configuration
        use_jwks: true
        bearer_only: true
        ssl_verify: false
      limit-req:
        rate: 30
        burst: 10
        key_type: var
        key: remote_addr
        rejected_code: 429
        # Body phải parse được thành JSON như mọi lỗi khác của DX-Desk; APISIX trả về
        # nguyên chuỗi này (Content-Type text/plain) nên khách hàng đọc theo `message`.
        rejected_msg: '{"statusCode":429,"error":"Too Many Requests","message":"Vượt quá tần suất cho phép, vui lòng thử lại sau."}'
    upstream:
      type: roundrobin
      nodes:
        "api:3000": 1

  - id: web
    uri: /*
    priority: -10
    upstream:
      type: roundrobin
      nodes:
        "web:80": 1
#END
