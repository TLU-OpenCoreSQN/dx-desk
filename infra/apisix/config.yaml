# APISIX chạy chế độ standalone: không cần etcd, route nằm trong apisix.yaml.
deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

nginx_config:
  http:
    # Do not log bearer download capabilities in query parameters or JWT headers.
    access_log_format: '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time'
    # APISIX đóng gói sẵn client_max_body_size = 1m (docs security-threat-model của APISIX).
    # Đính kèm tuần 3 đi nền base64 trong JSON nên 10 MiB nhị phân ~ 13,98 MB văn bản:
    # với trần 1m cổng sẽ chặn 413 trước khi tệp tới API và clamd kịp quét.
    # 20m để chừa chỗ cho phần header của JSON; trần nghiệp vụ 10 MiB vẫn do API và
    # CHECK attachments.size_bytes chốt (API trả 413/422 trước khi chạm clamd).
    client_max_body_size: 20m
    # KHÔNG thêm dns_resolver_valid ở đây: run #23/#24 đã bác. Set TTL 5 giây vẫn cho
    # "connect() failed (113: No route to host) ... upstream http://172.18.0.9:3000" -> 502
    # ở giây thứ 63 sau khi "dxdesk.mjs up" dựng lại api, trong khi job
    # "kiểm tra apisix.yaml" xanh (chứng tỏ key hợp schema nhưng không có tác dụng):
    # bảng cân bằng của APISIX giữ địa chỉ đã phân giải và không phân giải lại theo resolver
    # của nginx. Biện pháp duy nhất đã kiểm chứng là restart cổng sau khi triển khai lại,
    # đặt ở scripts/dxdesk.mjs (theo khuôn mẫu restart postgrest sẵn có).
