name: CI

on:
  pull_request:
  push:
    branches: [main, develop-quyennnv, sec-dev, week3-complete]

permissions:
  contents: read

jobs:
  reuse-lint:
    name: reuse lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5

  compose-config:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra cú pháp Compose
        run: |
          cp .env.example .env
          docker compose --env-file .env -f infra/compose/docker-compose.yml config -q
          docker compose --env-file .env -f infra/compose/docker-compose.yml -f infra/keycloak/compose-otp.yml config -q
          node -e "const fs=require('node:fs');if(!fs.existsSync('infra/keycloak/realm-dxdesk-otp.json'))process.exit(1)"
      - name: Không dùng thẻ latest
        run: |
          if grep -nE '^[A-Z_]+_VERSION=.*latest' .env.example; then
            echo "Không được ghim phiên bản bằng latest" >&2
            exit 1
          fi

  apisix-config:
    name: kiểm tra apisix.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nạp apisix.yaml bằng image APISIX
        run: sh scripts/check-apisix.sh
      - name: JWT, rate limit, body limit trên gateway thật
        run: node tools/testing/gateway-test.mjs

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra script
        run: shellcheck scripts/*.sh infra/postgres/init/*.sh

  apps:
    name: build và test ứng dụng
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - name: Cài đặt, build, kiểm thử
        working-directory: apps/${{ matrix.app }}
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run build
          npm test

  rls-integration:
    name: TN-02 RLS + máy trạng thái tuần 3 (PostgreSQL/PostgREST)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            tools/testing/package-lock.json
      - run: npm ci --prefix apps/api
      - run: npm run build --prefix apps/api
      - run: npm ci --prefix tools/testing
      - run: npm run integration --prefix tools/testing
      - name: Kiểm tra migration runner, checksum và rollback
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          node tools/testing/migration-test.mjs
      - run: npm run check --prefix tools/testing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: week2-database-evidence
          path: .local/reports/

  browser-ui:
    name: giao diện desktop và mobile (fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix apps/web
      - run: npm ci --prefix tools/testing
      - run: npx playwright install --with-deps chromium
        working-directory: tools/testing
      - run: npm run browser --prefix tools/testing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: week2-browser-evidence
          path: .local/reports/

  stack:
    name: nghiệm thu stack tuần 2
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Khởi chạy từ máy sạch
        run: |
          cp .env.example .env
          node scripts/dxdesk.mjs up
      - name: Keycloak, APISIX, API, RLS và n8n restart
        run: node scripts/stack-test.mjs --restart-n8n
      - name: Khởi chạy lần hai, giữ dữ liệu
        run: |
          make up
          node scripts/stack-test.mjs --verify-preserved
      - name: Nhật ký khi lỗi
        if: failure()
        run: docker compose --env-file .env -f infra/compose/docker-compose.yml logs --tail=100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: week2-stack-evidence
          path: .local/reports/stack.json
          if-no-files-found: ignore
      - name: Dừng stack CI
        if: always()
        run: docker compose --env-file .env -f infra/compose/docker-compose.yml down -v
