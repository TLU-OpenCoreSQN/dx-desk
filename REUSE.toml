version = 1
SPDX-PackageName = "dx-desk"
SPDX-PackageSupplier = "TLU-OpenCoreSQN"
SPDX-PackageDownloadLocation = "https://github.com/TLU-OpenCoreSQN/dx-desk"

# Tệp không viết được chú thích giấy phép (JSON, Markdown, tệp cấu hình git, tệp giữ chỗ).
[[annotations]]
path = [
  "**/*.json",
  "**/*.md",
  "**/.gitkeep",
  ".gitignore",
  ".gitattributes",
  "**/.dockerignore",
  "LICENSE",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 TLU-OpenCoreSQN"
SPDX-License-Identifier = "Apache-2.0"

# W5-08: bài tri thức nạp vào Wiki.js, phát hành theo CC BY 4.0 (khối sau ghi đè khối trên).
[[annotations]]
path = [
  "docs/wiki/vpn.md",
  "docs/wiki/email.md",
  "docs/wiki/wifi.md",
  "docs/wiki/phan-mem-nghiep-vu.md",
  "docs/wiki/mat-khau.md",
  "docs/wiki/phan-mem-ban-quyen.md",
  "docs/wiki/home.md",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 TLU-OpenCoreSQN"
SPDX-License-Identifier = "CC-BY-4.0"

# W5-03: phông Noto Sans nhúng vào biên bản bàn giao PDF.
[[annotations]]
path = ["apps/api/assets/fonts/*"]
precedence = "override"
SPDX-FileCopyrightText = "2022 The Noto Project Authors (https://github.com/notofonts/latin-greek-cyrillic)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["apps/web/public/data/synthetic/*.json"]
precedence = "override"
SPDX-FileCopyrightText = "2026 TLU-OpenCoreSQN"
SPDX-License-Identifier = "CC0-1.0"
