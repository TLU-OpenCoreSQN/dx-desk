openapi: 3.0.3
info:
  title: DX-Desk Service Desk API
  version: 0.2.0
  description: Khung API tuần 3 — thêm máy trạng thái ticket, Poka-yoke và SLA. Tất cả thao tác nghiệp vụ áp dụng PostgreSQL RLS.
servers:
  - url: http://localhost:9080/api
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: health
      security: []
      responses:
        "200":
          description: API và database sẵn sàng
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  service: { type: string }
                  version: { type: string }
        "503": { $ref: "#/components/responses/Error" }
  /me:
    get:
      operationId: me
      responses:
        "200":
          description: Danh tính của token đã xác thực
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  username: { type: string }
                  roles:
                    type: array
                    items: { type: string, enum: [Employee, Agent, Manager] }
        "401": { $ref: "#/components/responses/Error" }
  /categories:
    get:
      operationId: categories
      responses:
        "200":
          description: Danh mục đang hoạt động
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        code: { type: string }
                        name: { type: string }
                        description: { type: string }
                        requirement_fields:
                          type: array
                          items:
                            type: object
                            properties:
                              key: { type: string }
                              label: { type: string }
                              required: { type: boolean }
        "401": { $ref: "#/components/responses/Error" }
  /tickets:
    get:
      operationId: listTickets
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Yêu cầu nhìn thấy theo RLS, mới nhất trước
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Ticket" }
                  limit: { type: integer }
                  offset: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [category_id, title, description]
              properties:
                category_id: { type: string, format: uuid }
                title: { type: string, minLength: 5, maxLength: 200 }
                description: { type: string, minLength: 10, maxLength: 5000 }
                priority: { type: string, enum: [low, normal, high, critical], default: normal }
                fields:
                  type: object
                  additionalProperties: { type: string }
                  description: Giá trị các trường bắt buộc theo categories.requirement_fields
      responses:
        "201":
          description: >-
            Đã tạo ticket và audit trong cùng giao dịch. Employee tạo danh mục
            'access' nhận trạng thái khởi đầu pending_approval; priority critical
            chỉ Manager được phép.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /tickets/{id}:
    get:
      operationId: getTicket
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Chi tiết ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /tickets/{id}/status:
    patch:
      operationId: updateTicketStatus
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [to]
              properties:
                to: { type: string, enum: [new, triaged, assigned, in_progress, waiting_user, pending_approval, resolved, closed, cancelled] }
                note: { type: string, maxLength: 2000 }
                resolution_note: { type: string, minLength: 5, maxLength: 2000 }
      responses:
        "200":
          description: >-
            Chuyển trạng thái hợp lệ theo máy trạng thái; ticket_events được ghi
            trong cùng giao dịch. Vào waiting_user tạm dừng đồng hồ SLA, rời
            waiting_user cộng dồn vào sla_paused_ms.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { description: Vai trò hiện tại không được phép chuyển cạnh này }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: Cạnh vô hiệu theo máy trạng thái (trạng thái cuối hoặc không được phép) }
        "422": { description: Thiếu resolution_note khi chuyển sang resolved, hoặc trạng thái không hợp lệ }
  /tickets/{id}/events:
    get:
      operationId: ticketEvents
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Lịch sử có quyền đọc
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        ticket_id: { type: string, format: uuid }
                        actor_id: { type: string, format: uuid }
                        event_type: { type: string }
                        payload: { type: object }
                        created_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /tickets/{id}/attachments:
    post:
      operationId: uploadAttachment
      summary: Tải tệp đính kèm kèm quét virus clamd (ADR 0007)
      description: >-
        DEVIATION từ ADR 0007 (ghi "multipart"): body là JSON với nội dung nhị phân mã
        base64, vì package.json bị CI ghim bằng `npm ci` và multer không phải dependency
        khai báo. API quét stream qua clamd INSTREAM/TCP TRƯỚC, chỉ PUT object lên
        SeaweedFS khi sạch, rồi insert metadata; infected => 422 (không ghi SeaweedFS,
        metadata scan_status='infected'); clamd lỗi/timeout => 503 (scan_status='failed').
        file_name chỉ lưu vào cột, không dùng làm object key (server sinh key).
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [file_name, content_type, content_base64]
              properties:
                file_name: { type: string, minLength: 1, maxLength: 255 }
                content_type:
                  type: string
                  enum: [image/png, image/jpeg, image/gif, image/webp, application/pdf, text/plain]
                content_base64:
                  type: string
                  format: byte
                  description: Nhị phân base64; sau giải mã phải > 0 và <= 10 MiB (khớp CHECK attachments.size_bytes)
      responses:
        "201":
          description: Tệp sạch đã lưu vào SeaweedFS, metadata scan_status='clean'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "400":
          description: "Content type ngoài allow-list, base64 rác hoặc body ngoài DTO"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404":
          description: "Ticket không nhìn thấy theo RLS (không quét, không lưu)"
        "422":
          description: "Tệp quá cỡ/rỗng, hoặc clamd báo nhiễm (không ghi SeaweedFS, ghi metadata infected)"
        "503":
          description: "clamd không trả lời/timeout hoặc SeaweedFS lỗi (metadata scan_status='failed')"
  /device-requests:
    get:
      operationId: listDeviceRequests
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Yêu cầu thiết bị theo quyền hiện tại
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DeviceRequest" }
                  limit: { type: integer }
                  offset: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createDeviceRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [device_type, reason]
              properties:
                device_type: { type: string, enum: [laptop, monitor, keyboard, mouse, other] }
                reason: { type: string, minLength: 10, maxLength: 2000 }
                quantity: { type: integer, minimum: 1, maximum: 10, default: 1 }
      responses:
        "201":
          description: Yêu cầu thiết bị trạng thái pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak RS256, issuer realm dxdesk, audience dxdesk-api
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Offset:
      in: query
      name: offset
      schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
  responses:
    Error:
      description: Lỗi xác thực, quyền hoặc dữ liệu; 404 cũng được dùng khi RLS ẩn bản ghi
      content:
        application/json:
          schema:
            type: object
            properties:
              statusCode: { type: integer }
              message:
                oneOf:
                  - { type: string }
                  - { type: array, items: { type: string } }
  schemas:
    Ticket:
      type: object
      properties:
        id: { type: string, format: uuid }
        requester_id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        priority: { type: string, enum: [low, normal, high, critical] }
        status: { type: string, enum: [new, triaged, assigned, in_progress, waiting_user, pending_approval, resolved, closed, cancelled] }
        assigned_to: { type: string, format: uuid, nullable: true }
        resolution_note: { type: string, nullable: true, minLength: 5, maxLength: 2000 }
        request_fields:
          type: object
          additionalProperties: { type: string }
        sla_due_at: { type: string, format: date-time, nullable: true }
        sla_paused_ms: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DeviceRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        requester_id: { type: string, format: uuid }
        device_type: { type: string, enum: [laptop, monitor, keyboard, mouse, other] }
        reason: { type: string }
        quantity: { type: integer }
        status: { type: string, enum: [pending, approved, rejected, fulfilled] }
        created_at: { type: string, format: date-time }
    Attachment:
      type: object
      properties:
        id: { type: string, format: uuid }
        ticket_id: { type: string, format: uuid }
        uploaded_by: { type: string, format: uuid }
        file_name: { type: string, maxLength: 255 }
        object_key:
          type: string
          description: "Key do server sinh: attachments/<ticket>/<uuid>"
        content_type: { type: string }
        size_bytes: { type: integer, minimum: 1, maximum: 10485760 }
        scan_status: { type: string, enum: [clean, infected, failed] }
        created_at: { type: string, format: date-time }
