openapi: 3.0.3
info:
  title: DX-Desk Service Desk API
  version: 0.4.0
  description: >-
    API tuần 4–5: luồng ticket, queue/team/claim, automation tách khỏi người dùng, outbox, SLA; tuần 5 thêm gợi ý bài Wiki và lượt tự phục vụ. RLS vẫn bảo vệ dữ liệu.
servers:
  - url: http://localhost:9080/api
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: health
      security: []
      responses:
        "200":
          description: API và database sẵn sàng
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ ok ] }
                  service: { type: string }
                  version: { type: string }
        "503": { $ref: "#/components/responses/Error" }
  /me:
    get:
      operationId: me
      responses:
        "200":
          description: Danh tính của token đã xác thực
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  username: { type: string }
                  roles:
                    type: array
                    items: { type: string, enum: [ Employee, Agent, Manager ] }
        "401": { $ref: "#/components/responses/Error" }
  /analytics/embed:
    get:
      operationId: managerAnalyticsEmbed
      description: Manager nhận URL nhúng Metabase có chữ ký và hết hạn sau 5 phút. Cần hồ sơ full.
      responses:
        "200":
          description: URL iframe, không lưu bộ nhớ đệm
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /categories:
    get:
      operationId: categories
      responses:
        "200":
          description: Danh mục đang hoạt động
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        code: { type: string }
                        name: { type: string }
                        description: { type: string }
                        requirement_fields:
                          type: array
                          items:
                            type: object
                            properties:
                              key: { type: string }
                              label: { type: string }
                              required: { type: boolean }
        "401": { $ref: "#/components/responses/Error" }
  /categories/{id}/articles:
    get:
      operationId: categoryArticles
      description: W5-08. Bài Wiki.js gợi ý cho danh mục, theo bảng ánh xạ category_articles. `url` là null khi API chưa có WIKI_PUBLIC_URL.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Bài gợi ý theo thứ tự hiển thị
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        slug: { type: string }
                        title: { type: string }
                        summary: { type: string }
                        url: { type: string, format: uri, nullable: true }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /self-service:
    post:
      operationId: recordSelfService
      description: >-
        W5-08. Ghi một lượt "Đã tự xử lý được"; không tạo ticket. Chủ thể lấy từ JWT, không nhận user_id.
        Mỗi người chỉ đọc được lượt của mình (RLS); số liệu tổng hợp ở view reporting.self_service_weekly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [category_id, article_id]
              properties:
                category_id: { type: string, format: uuid }
                article_id: { type: string, format: uuid }
      responses:
        "201":
          description: Lượt tự phục vụ đã ghi
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  category_id: { type: string, format: uuid }
                  article_id: { type: string, format: uuid }
                  created_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /tickets:
    get:
      operationId: listTickets
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
        - in: query
          name: queue
          schema:
            type: string
            enum:
              - my_open
              - team_unassigned
              - team_assigned
              - pending_approval
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: team_id
          schema:
            type: string
            format: uuid
        - in: query
          name: assignee_id
          schema:
            type: string
            format: uuid
        - in: query
          name: assignee
          schema:
            type: string
            enum:
              - me
      responses:
        "200":
          description: Yêu cầu nhìn thấy theo RLS, mới nhất trước
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Ticket" }
                  limit: { type: integer }
                  offset: { type: integer }
                  total:
                    type: integer
                    minimum: 0
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: createTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ category_id, title, description ]
              properties:
                category_id: { type: string, format: uuid }
                title: { type: string, minLength: 5, maxLength: 200 }
                description: { type: string, minLength: 10, maxLength: 5000 }
                priority: { type: string, enum: [ low, normal, high, critical ], default: normal }
                fields:
                  type: object
                  additionalProperties: { type: string }
                  description: Giá trị các trường bắt buộc theo categories.requirement_fields
      responses:
        "201":
          description: >-
            Đã tạo ticket và audit trong cùng giao dịch. Employee tạo danh mục 'access' nhận trạng thái khởi đầu
            pending_approval; priority critical chỉ Manager được phép.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /tickets/{id}:
    get:
      operationId: getTicket
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Chi tiết ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /tickets/{id}/status:
    patch:
      operationId: updateTicketStatus
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ to ]
              properties:
                to:
                  {
                    type: string,
                    enum: [ new, triaged, assigned, in_progress, waiting_user, pending_approval, resolved, closed, cancelled ]
                  }
                note: { type: string, maxLength: 2000 }
                resolution_note: { type: string, minLength: 5, maxLength: 2000 }
                expected_version:
                  type: integer
                  minimum: 1
                  description: Tùy chọn cho client cũ; phiên bản không khớp trả 409 trước khi đổi trạng thái.
      responses:
        "200":
          description: >-
            Chuyển trạng thái hợp lệ theo máy trạng thái; ticket_events được ghi trong cùng giao dịch. Vào waiting_user
            tạm dừng đồng hồ SLA, rời waiting_user cộng dồn vào sla_paused_ms.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { description: Vai trò hiện tại không được phép chuyển cạnh này }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: Cạnh vô hiệu theo máy trạng thái (trạng thái cuối hoặc không được phép) }
        "422": { description: Thiếu resolution_note khi chuyển sang resolved, hoặc trạng thái không hợp lệ }
  /tickets/{id}/events:
    get:
      operationId: ticketEvents
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Lịch sử có quyền đọc
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TicketEvent"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /tickets/{id}/attachments:
    get:
      operationId: listAttachments
      summary: Metadata theo RLS, không trả object_key
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Danh sách metadata gồm pending, clean, infected, failed
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: uploadAttachment
      summary: Tải tệp đính kèm kèm quét virus clamd (ADR 0007)
      description: >-
        Body JSON/base64 được buffer trong RAM, tối đa 10 MiB nhị phân. API quét qua clamd INSTREAM/TCP TRƯỚC, commit
        intent pending rồi PUT object lên SeaweedFS Filer khi sạch và hoàn tất metadata; infected => 422 (không ghi
        SeaweedFS, metadata scan_status='infected'); clamd lỗi/timeout => 503 (scan_status='failed'). file_name chỉ lưu
        vào cột, không dùng làm object key (server sinh key).
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ file_name, content_type, content_base64 ]
              properties:
                file_name: { type: string, minLength: 1, maxLength: 255 }
                content_type:
                  type: string
                  enum: [ image/png, image/jpeg, image/gif, image/webp, application/pdf, text/plain ]
                content_base64:
                  type: string
                  format: byte
                  description: Nhị phân base64; sau giải mã phải > 0 và <= 10 MiB (khớp CHECK attachments.size_bytes)
      responses:
        "201":
          description: Tệp sạch đã lưu vào SeaweedFS, metadata scan_status='clean'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "400":
          description: "Content type ngoài allow-list, base64 rác hoặc body ngoài DTO"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404":
          description: "Ticket không nhìn thấy theo RLS (không quét, không lưu)"
        "422":
          description: "Tệp quá cỡ/rỗng, hoặc clamd báo nhiễm (không ghi SeaweedFS, ghi metadata infected)"
        "503":
          description: "clamd không trả lời/timeout hoặc SeaweedFS lỗi (metadata scan_status='failed')"
  /attachments/{id}/download-url:
    post:
      operationId: issueAttachmentDownload
      summary: Kiểm RLS và trạng thái clean rồi cấp URL ký HMAC hạn 120 giây
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "201":
          description: URL tương đối cùng origin, Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [ url, expires_at ]
                properties:
                  url: { type: string }
                  expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /attachments/{id}/content:
    get:
      operationId: downloadAttachment
      summary: Đọc tệp bằng capability ký, không nhận JWT trong URL
      security: []
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - in: query
          name: expires
          required: true
          schema: { type: string, pattern: '^[0-9]{10}$' }
        - in: query
          name: signature
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        "200":
          description: Bytes tải xuống, Content-Disposition attachment, nosniff, no-store
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /device-requests:
    get:
      operationId: listDeviceRequests
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Yêu cầu thiết bị theo quyền hiện tại
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DeviceRequest" }
                  limit: { type: integer }
                  offset: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createDeviceRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ device_type, reason ]
              properties:
                device_type: { type: string, enum: [ laptop, monitor, keyboard, mouse, other ] }
                reason: { type: string, minLength: 10, maxLength: 2000 }
                quantity: { type: integer, minimum: 1, maximum: 10, default: 1 }
      responses:
        "201":
          description: Yêu cầu thiết bị trạng thái pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /teams:
    get:
      operationId: listTeams
      summary: Danh sách team và roster đang hoạt động; chỉ Agent/Manager
      responses:
        "200":
          description: "{data:[{id,name,active,members:[{user_id,display_name,active}]}]}"
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Team"
        "401": &a1
          $ref: "#/components/responses/Error"
        "403": *a1
  /tickets/{id}/claim:
    post:
      operationId: claimTicket
      summary: Agent thuộc team nhận phiếu assigned; cùng người retry 200, người khác 409
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      responses:
        "200":
          description: Giao dịch thành công; phản hồi sau durable commit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400": &a1
          $ref: "#/components/responses/Error"
        "401": *a1
        "403": *a1
        "404": *a1
        "409": *a1
        "422": *a1
        "503": *a1
  /system/events/{id}/process:
    post:
      operationId: processAutomationEvent
      summary: Xử lý event lưu trong outbox; callback lặp trả kết quả durable
      description: "Service JWT riêng: RS256, issuer/audience hợp lệ, role=ticket_automation, azp=dxdesk-automation, realm
        role ticket-automation; không nhận human token."
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                schema_version:
                  type: integer
                  enum:
                    - 1
              required:
                - schema_version
      responses:
        "200":
          description: Giao dịch thành công; phản hồi sau durable commit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationAck"
        "400": &a1
          $ref: "#/components/responses/Error"
        "401": *a1
        "403": *a1
        "404": *a1
        "409": *a1
        "422": *a1
        "503": *a1
  /system/sla/evaluate:
    post:
      operationId: evaluateSla
      summary: Đánh giá SLA và enqueue notice idempotent; không nhận clock từ client
      description: "Service JWT riêng: RS256, issuer/audience hợp lệ, role=ticket_automation, azp=dxdesk-automation, realm
        role ticket-automation; không nhận human token."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      responses:
        "200":
          description: Giao dịch thành công; phản hồi sau durable commit.
          content:
            application/json:
              schema:
                type: object
                required:
                  - queued
                properties:
                  queued:
                    type: integer
                    minimum: 0
        "400": &a1
          $ref: "#/components/responses/Error"
        "401": *a1
        "403": *a1
        "404": *a1
        "409": *a1
        "422": *a1
        "503": *a1
  /system/teams:
    get:
      operationId: automationTeams
      summary: Metadata team tối thiểu phục vụ provisioning roster
      description: "Service JWT riêng: RS256, issuer/audience hợp lệ, role=ticket_automation, azp=dxdesk-automation, realm
        role ticket-automation; không nhận human token."
      responses:
        "200":
          description: Giao dịch thành công; phản hồi sau durable commit.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Team"
        "400": &a1
          $ref: "#/components/responses/Error"
        "401": *a1
        "403": *a1
        "404": *a1
        "409": *a1
        "422": *a1
        "503": *a1
  /system/outbox:
    get:
      operationId: outboxStatus
      summary: pending/processing/failed/oldest_pending_at
      description: "Service JWT riêng: RS256, issuer/audience hợp lệ, role=ticket_automation, azp=dxdesk-automation, realm
        role ticket-automation; không nhận human token."
      responses:
        "200":
          description: Giao dịch thành công; phản hồi sau durable commit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxStatus"
        "400": &a1
          $ref: "#/components/responses/Error"
        "401": *a1
        "403": *a1
        "404": *a1
        "409": *a1
        "422": *a1
        "503": *a1
  /system/outbox/{id}/replay:
    post:
      operationId: replayOutbox
      summary: Chỉ đưa delivery failed về pending; không xóa inbox/audit
      description: "Service JWT riêng: RS256, issuer/audience hợp lệ, role=ticket_automation, azp=dxdesk-automation, realm
        role ticket-automation; không nhận human token."
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      responses:
        "200":
          description: Giao dịch thành công; phản hồi sau durable commit.
          content:
            application/json:
              schema:
                type: object
                required:
                  - replayed
                properties:
                  replayed:
                    type: boolean
        "400": &a1
          $ref: "#/components/responses/Error"
        "401": *a1
        "403": *a1
        "404": *a1
        "409": *a1
        "422": *a1
        "503": *a1
  /system/roster:
    post:
      operationId: syncRoster
      summary: Đồng bộ tối đa 100 thành viên có UUID Keycloak thật
      description: "Service JWT riêng: RS256, issuer/audience hợp lệ, role=ticket_automation, azp=dxdesk-automation, realm
        role ticket-automation; không nhận human token."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                members:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - team_id
                      - user_id
                      - display_name
                      - active
                    properties:
                      team_id:
                        type: string
                        format: uuid
                      user_id:
                        type: string
                        format: uuid
                      display_name:
                        type: string
                        minLength: 1
                        maxLength: 255
                      active:
                        type: boolean
              required:
                - members
      responses:
        "200":
          description: Giao dịch thành công; phản hồi sau durable commit.
          content:
            application/json:
              schema:
                type: object
                required:
                  - updated
                properties:
                  updated:
                    type: integer
                    minimum: 0
        "400": &a1
          $ref: "#/components/responses/Error"
        "401": *a1
        "403": *a1
        "404": *a1
        "409": *a1
        "422": *a1
        "503": *a1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak RS256, issuer realm dxdesk, audience dxdesk-api
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Offset:
      in: query
      name: offset
      schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
  responses:
    Error:
      description: Lỗi xác thực, quyền hoặc dữ liệu; 404 cũng được dùng khi RLS ẩn bản ghi
      content:
        application/json:
          schema:
            type: object
            properties:
              statusCode: { type: integer }
              message:
                oneOf:
                  - { type: string }
                  - { type: array, items: { type: string } }
  schemas:
    Ticket:
      type: object
      properties:
        id: { type: string, format: uuid }
        requester_id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        priority: { type: string, enum: [ low, normal, high, critical ] }
        status:
          {
            type: string,
            enum: [ new, triaged, assigned, in_progress, waiting_user, pending_approval, resolved, closed, cancelled ]
          }
        assigned_to: { type: string, format: uuid, nullable: true }
        resolution_note: { type: string, nullable: true, minLength: 5, maxLength: 2000 }
        request_fields:
          type: object
          additionalProperties: { type: string }
        sla_due_at: { type: string, format: date-time, nullable: true }
        sla_paused_ms: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        assigned_team_id:
          type: string
          format: uuid
          nullable: true
        team_name:
          type: string
          nullable: true
        assignee_name:
          type: string
          nullable: true
        requester_name:
          type: string
          nullable: true
        ticket_version:
          type: integer
          format: int64
          minimum: 1
        sla_breached:
          type: boolean
        sla_breached_at:
          type: string
          format: date-time
          nullable: true
        waiting_since:
          type: string
          format: date-time
          nullable: true
    DeviceRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        requester_id: { type: string, format: uuid }
        device_type: { type: string, enum: [ laptop, monitor, keyboard, mouse, other ] }
        reason: { type: string }
        quantity: { type: integer }
        status: { type: string, enum: [ pending, approved, rejected, fulfilled ] }
        created_at: { type: string, format: date-time }
    Attachment:
      type: object
      properties:
        id: { type: string, format: uuid }
        ticket_id: { type: string, format: uuid }
        uploaded_by: { type: string, format: uuid }
        file_name: { type: string, maxLength: 255 }
        object_key:
          type: string
          description: "Key do server sinh: attachments/<ticket>/<uuid>"
        content_type: { type: string }
        size_bytes: { type: integer, minimum: 1, maximum: 10485760 }
        scan_status: { type: string, enum: [ pending, clean, infected, failed ] }
        created_at: { type: string, format: date-time }
    TicketEvent:
      type: object
      required:
        - id
        - ticket_id
        - actor_id
        - event_type
        - payload
        - created_at
        - actor_type
        - actor_name
      properties:
        id: &a2
          type: string
          format: uuid
        ticket_id: *a2
        actor_id: *a2
        event_type:
          type: string
          enum:
            - created
            - status_changed
            - assignment_changed
            - routing_unresolved
            - sla_warning
            - sla_breached
        payload:
          type: object
        created_at:
          type: string
          format: date-time
        actor_type:
          type: string
          enum:
            - user
            - system
            - ai
        actor_name:
          type: string
    Team:
      type: object
      required:
        - id
        - name
        - active
      properties:
        id: &a2
          type: string
          format: uuid
        name:
          type: string
        active:
          type: boolean
        members:
          type: array
          items:
            type: object
            required:
              - user_id
              - display_name
              - active
            properties:
              user_id: *a2
              display_name:
                type: string
              active:
                type: boolean
    AutomationAck:
      type: object
      required:
        - event_id
        - ticket_id
        - result
      properties:
        event_id: &a2
          type: string
          format: uuid
        ticket_id: *a2
        result:
          type: string
          enum:
            - routed
            - skipped
            - unresolved
            - notification
        status:
          type: string
        team_id:
          type: string
          format: uuid
          nullable: true
        notification:
          type: object
          required:
            - kind
            - team_id
          properties:
            kind:
              type: string
              enum:
                - assignment
                - status
                - sla_warning
                - sla_breached
            team_id:
              type: string
              format: uuid
              nullable: true
    OutboxStatus:
      type: object
      required:
        - pending
        - processing
        - failed
        - oldest_pending_at
      properties:
        pending:
          type: integer
          minimum: 0
        processing:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        oldest_pending_at:
          type: string
          format: date-time
          nullable: true
