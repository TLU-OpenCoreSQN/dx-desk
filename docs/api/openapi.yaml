openapi: 3.0.3
info:
  title: DX-Desk Service Desk API
  version: 0.5.0
  description: >-
    API tuần 4–5: luồng ticket, queue/team/claim, automation tách khỏi người dùng, outbox, SLA; tuần 5 thêm gợi ý bài Wiki, lượt tự phục vụ và JSON-LD/DCAT công khai tại /ld/* (ngoài tiền tố /api). RLS vẫn bảo vệ dữ liệu.
servers:
  - url: http://localhost:9080/api
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: health
      security: []
      responses:
        "200":
          description: API và database sẵn sàng
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ ok ] }
                  service: { type: string }
                  version: { type: string }
        "503": { $ref: "#/components/responses/Error" }
  /ld/catalog:
    servers:
      - url: http://localhost:9080
    get:
      operationId: linkedDataCatalog
      summary: Danh mục DCAT công khai (W5-04)
      security: []
      responses:
        "200":
          description: dcat:Catalog gồm ba dcat:Dataset dữ liệu giả lập
          headers:
            Cache-Control: { schema: { type: string, example: "public, max-age=300" } }
          content:
            application/ld+json:
              schema: { $ref: "#/components/schemas/LinkedDataCatalog" }
  /ld/{kind}:
    servers:
      - url: http://localhost:9080
    get:
      operationId: linkedDataCollection
      summary: Danh sách tài nguyên tham chiếu đang hoạt động
      security: []
      parameters:
        - in: path
          name: kind
          required: true
          schema: { type: string, enum: [ services, request-types, device-types ] }
      responses:
        "200":
          description: Đồ thị JSON-LD của nhóm tài nguyên
          content:
            application/ld+json:
              schema:
                type: object
                required: [ "@context", "@id", "@graph" ]
                properties:
                  "@context": { type: object }
                  "@id": { type: string, example: /ld/services }
                  "@graph":
                    type: array
                    items: { type: object }
        "404": { $ref: "#/components/responses/Error" }
  /ld/{kind}/{code}:
    servers:
      - url: http://localhost:9080
    get:
      operationId: linkedDataResource
      summary: Dịch vụ, loại yêu cầu hoặc loại thiết bị dạng JSON-LD (W5-04)
      security: []
      parameters:
        - in: path
          name: kind
          required: true
          schema: { type: string, enum: [ services, request-types, device-types ] }
        - in: path
          name: code
          required: true
          schema: { type: string, pattern: "^[a-z][a-z0-9_-]{1,39}$", example: vpn }
      responses:
        "200":
          description: schema:Service, schema:DefinedTerm hoặc schema:Product
          content:
            application/ld+json:
              schema: { $ref: "#/components/schemas/LinkedDataResource" }
        "404": { $ref: "#/components/responses/Error" }
  /assistant-sessions:
    get:
      operationId: listAssistantSessions
      summary: Hội thoại riêng của tài khoản hiện tại
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: 50 hội thoại theo hoạt động gần nhất
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AssistantSession" } }
                  has_more: { type: boolean }
    post:
      operationId: createAssistantSession
      summary: Bắt đầu một hội thoại có ngữ cảnh riêng
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "201":
          description: Hội thoại mới
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantSession" }
  /assistant-sessions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: readAssistantSession
      summary: Đọc 40 lượt chat gần nhất và tải lịch sử cũ
      parameters:
        - { name: before, in: query, schema: { type: string, pattern: "^[0-9]{1,18}$" } }
      responses:
        "200":
          description: Tin nhắn theo thứ tự thời gian
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { $ref: "#/components/schemas/AssistantSession" }
                  turns: { type: array, items: { $ref: "#/components/schemas/AssistantTurn" } }
                  has_more: { type: boolean }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: renameAssistantSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200":
          description: Hội thoại đã đổi tên
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantSession" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAssistantSession
      summary: Xóa hội thoại cùng tin nhắn và bộ nhớ
      responses:
        "204": { description: Đã xóa }
        "404": { $ref: "#/components/responses/Error" }
  /assistant-sessions/{id}/turns/start:
    post:
      operationId: beginAssistantTurn
      description: Dịch vụ trợ lý gọi với JWT và HMAC ký [owner, start + dấu hai chấm + id, body]. Một hội thoại có một lượt pending. Lease 5 phút.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-DXDesk-Assistant-Proof, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id, question]
              properties:
                request_id: { type: string, format: uuid }
                question: { type: string, minLength: 1, maxLength: 8000 }
      responses:
        "200": { description: Lịch sử tin cậy và bộ nhớ hoặc kết quả cũ của request_id }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /assistant-sessions/{id}/turns/{turnId}/finish:
    post:
      operationId: finishAssistantTurn
      description: Endpoint tương thích vẫn yêu cầu JWT và HMAC. Dịch vụ trợ lý lưu qua route nội bộ HMAC để kết quả không phụ thuộc JWT hết hạn giữa stream; vẫn áp dụng RLS và lưu trước sự kiện done.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: turnId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-DXDesk-Assistant-Proof, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer, status, metadata]
              properties:
                answer: { type: string, maxLength: 16000 }
                status: { type: string, enum: [complete, error, interrupted] }
                metadata: { type: object }
                summary: { type: string, maxLength: 12000 }
                summarized_through: { type: string, pattern: "^[0-9]{1,18}$" }
      responses:
        "200": { description: Đã lưu }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /assistant-sessions/proposals/{id}:
    get:
      operationId: readConversationProposal
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Đề xuất còn hiệu lực thuộc hội thoại của tài khoản }
        "404": { $ref: "#/components/responses/Error" }
  /assistant-sessions/proposals/{id}/cancel:
    post:
      operationId: cancelConversationProposal
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Đề xuất đã hủy }
        "409": { $ref: "#/components/responses/Error" }
  /assistant/chat:
    post:
      operationId: streamAssistantChat
      summary: Trợ lý hồ sơ full trả lời và đề xuất hành động qua NDJSON
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, minLength: 1, maxLength: 8000 }
                session_id: { type: string, format: uuid, description: Gửi cùng request_id để tiếp tục hội thoại đã lưu }
                request_id: { type: string, format: uuid, description: Giữ nguyên khi thử lại cùng tin nhắn }
      responses:
        "200":
          description: Các dòng turn, step, delta, sources, proposal, done hoặc error
          content:
            application/x-ndjson:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Error" }
  /assistant/confirm:
    post:
      operationId: decideAssistantAction
      summary: Xác nhận hoặc hủy đề xuất của tài khoản đang đăng nhập
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, approve]
              properties:
                id: { type: string, format: uuid }
                approve: { type: boolean }
      responses:
        "200": { description: Quyết định và mã phiếu hoặc task nếu được tạo }
        "404": { $ref: "#/components/responses/Error" }
  /assistant-tools:
    get:
      operationId: listAssistantTools
      summary: Danh sách công cụ theo vai trò của người hỏi
      responses:
        "200": { description: Mảng tools chứa các tên công cụ }
  /assistant-tools/{kind}:
    post:
      operationId: executeAssistantTool
      summary: Chạy công cụ với quyền người hỏi. Công cụ ghi cần chữ ký nội bộ sau xác nhận.
      parameters:
        - in: path
          name: kind
          required: true
          schema: { type: string, enum: [ticket_statistics, similar_tickets, create_ticket, create_task] }
      responses:
        "200": { description: Kết quả truy vấn hoặc mã phiếu hoặc task }
        "403": { $ref: "#/components/responses/Error" }
  /assistant-tools/tasks/{id}:
    get:
      operationId: readAssistantTask
      summary: Người tạo đọc task đã xác nhận
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Task cùng nội dung và nguồn gốc AI }
        "404": { $ref: "#/components/responses/Error" }
  /tickets/{id}/ai-suggestion:
    get:
      operationId: readTicketAiSuggestion
      summary: Agent hoặc Manager xem đề xuất phân loại phiếu
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Đề xuất còn hiệu lực gồm id, category_id, team_id, priority và summary }
        "204": { description: Phiếu không còn đề xuất chờ duyệt }
        "403": { $ref: "#/components/responses/Error" }
  /tickets/{id}/ai-suggestion/decision:
    post:
      operationId: decideTicketAiSuggestion
      summary: Áp dụng hoặc bỏ qua đề xuất đúng phiên bản
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, action]
              properties:
                id: { type: string, format: uuid }
                action: { type: string, enum: [accept, ignore] }
                values:
                  type: object
                  required: [category_id, team_id, priority, summary]
                  properties:
                    category_id: { type: string, format: uuid }
                    team_id: { type: string, format: uuid }
                    priority: { type: string, enum: [low, normal, high] }
                    summary: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "204": { description: Đã lưu quyết định }
        "409": { $ref: "#/components/responses/Error" }
  /me:
    get:
      operationId: me
      responses:
        "200":
          description: Danh tính của token đã xác thực
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  username: { type: string }
                  assistant_enabled: { type: boolean, description: Tính năng trợ lý AI được bật trong hồ sơ full }
                  roles:
                    type: array
                    items: { type: string, enum: [ Employee, Agent, Manager ] }
        "401": { $ref: "#/components/responses/Error" }
  /analytics/embed:
    get:
      operationId: managerAnalyticsEmbed
      description: Manager nhận URL nhúng Metabase có chữ ký và hết hạn sau 5 phút. Cần hồ sơ full.
      responses:
        "200":
          description: URL iframe, không lưu bộ nhớ đệm
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /categories:
    get:
      operationId: categories
      responses:
        "200":
          description: Danh mục đang hoạt động
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        code: { type: string }
                        name: { type: string }
                        description: { type: string }
                        requirement_fields:
                          type: array
                          items:
                            type: object
                            properties:
                              key: { type: string }
                              label: { type: string }
                              required: { type: boolean }
                              placeholder: { type: string, description: "Ví dụ trong ô nhập (không bắt buộc, từ cấu hình doanh nghiệp)." }
                              hint: { type: string, description: "Dòng giải thích dưới ô nhập (không bắt buộc, từ cấu hình doanh nghiệp)." }
        "401": { $ref: "#/components/responses/Error" }
  /categories/{id}/articles:
    get:
      operationId: categoryArticles
      description: W5-08. Bài Wiki.js gợi ý cho danh mục, theo bảng ánh xạ category_articles. `url` là null khi API chưa có WIKI_PUBLIC_URL.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Bài gợi ý theo thứ tự hiển thị
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        slug: { type: string }
                        title: { type: string }
                        summary: { type: string }
                        url: { type: string, format: uri, nullable: true }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /self-service:
    post:
      operationId: recordSelfService
      description: >-
        W5-08. Ghi một lượt "Đã tự xử lý được"; không tạo ticket. Chủ thể lấy từ JWT, không nhận user_id.
        Mỗi người chỉ đọc được lượt của mình (RLS); số liệu tổng hợp ở view reporting.self_service_weekly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [category_id, article_id]
              properties:
                category_id: { type: string, format: uuid }
                article_id: { type: string, format: uuid }
      responses:
        "201":
          description: Lượt tự phục vụ đã ghi
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  category_id: { type: string, format: uuid }
                  article_id: { type: string, format: uuid }
                  created_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /tickets:
    get:
      operationId: listTickets
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
        - in: query
          name: queue
          schema:
            type: string
            enum:
              - my_open
              - team_unassigned
              - team_assigned
              - pending_approval
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: team_id
          schema:
            type: string
            format: uuid
        - in: query
          name: assignee_id
          schema:
            type: string
            format: uuid
        - in: query
          name: assignee
          schema:
            type: string
            enum:
              - me
      responses:
        "200":
          description: Yêu cầu nhìn thấy theo RLS, mới nhất trước
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Ticket" }
                  limit: { type: integer }
                  offset: { type: integer }
                  total:
                    type: integer
                    minimum: 0
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: createTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ category_id, title, description ]
              properties:
                category_id: { type: string, format: uuid }
                title: { type: string, minLength: 5, maxLength: 200 }
                description: { type: string, minLength: 10, maxLength: 5000 }
                priority: { type: string, enum: [ low, normal, high, critical ], default: normal }
                fields:
                  type: object
                  additionalProperties: { type: string }
                  description: Giá trị các trường bắt buộc theo categories.requirement_fields
      responses:
        "201":
          description: >-
            Đã tạo ticket và audit trong cùng giao dịch. Employee tạo danh mục 'access' nhận trạng thái khởi đầu
            pending_approval; priority critical chỉ Manager được phép.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /tickets/{id}:
    get:
      operationId: getTicket
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Chi tiết ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /tickets/{id}/status:
    patch:
      operationId: updateTicketStatus
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ to ]
              properties:
                to:
                  {
                    type: string,
                    enum: [ new, triaged, assigned, in_progress, waiting_user, pending_approval, resolved, closed, cancelled ]
                  }
                note: { type: string, maxLength: 2000 }
                resolution_note: { type: string, minLength: 5, maxLength: 2000 }
                expected_version:
                  type: integer
                  minimum: 1
                  description: Tùy chọn cho client cũ; phiên bản không khớp trả 409 trước khi đổi trạng thái.
      responses:
        "200":
          description: >-
            Chuyển trạng thái hợp lệ theo máy trạng thái; ticket_events được ghi trong cùng giao dịch. Vào waiting_user
            tạm dừng đồng hồ SLA, rời waiting_user cộng dồn vào sla_paused_ms.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { description: Vai trò hiện tại không được phép chuyển cạnh này }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: Cạnh vô hiệu theo máy trạng thái (trạng thái cuối hoặc không được phép) }
        "422": { description: Thiếu resolution_note khi chuyển sang resolved, hoặc trạng thái không hợp lệ }
  /tickets/{id}/events:
    get:
      operationId: ticketEvents
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Lịch sử có quyền đọc
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TicketEvent"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /tickets/{id}/attachments:
    get:
      operationId: listAttachments
      summary: Metadata theo RLS, không trả object_key
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Danh sách metadata gồm pending, clean, infected, failed
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: uploadAttachment
      summary: Tải tệp đính kèm kèm quét virus clamd (ADR 0007)
      description: >-
        Body JSON/base64 được buffer trong RAM, tối đa 10 MiB nhị phân. API quét qua clamd INSTREAM/TCP TRƯỚC, commit
        intent pending rồi PUT object lên SeaweedFS Filer khi sạch và hoàn tất metadata; infected => 422 (không ghi
        SeaweedFS, metadata scan_status='infected'); clamd lỗi/timeout => 503 (scan_status='failed'). file_name chỉ lưu
        vào cột, không dùng làm object key (server sinh key).
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ file_name, content_type, content_base64 ]
              properties:
                file_name: { type: string, minLength: 1, maxLength: 255 }
                content_type:
                  type: string
                  enum: [ image/png, image/jpeg, image/gif, image/webp, application/pdf, text/plain ]
                content_base64:
                  type: string
                  format: byte
                  description: Nhị phân base64; sau giải mã phải > 0 và <= 10 MiB (khớp CHECK attachments.size_bytes)
      responses:
        "201":
          description: Tệp sạch đã lưu vào SeaweedFS, metadata scan_status='clean'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "400":
          description: "Content type ngoài allow-list, base64 rác hoặc body ngoài DTO"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404":
          description: "Ticket không nhìn thấy theo RLS (không quét, không lưu)"
        "422":
          description: "Tệp quá cỡ/rỗng, hoặc clamd báo nhiễm (không ghi SeaweedFS, ghi metadata infected)"
        "503":
          description: "clamd không trả lời/timeout hoặc SeaweedFS lỗi (metadata scan_status='failed')"
  /attachments/{id}/download-url:
    post:
      operationId: issueAttachmentDownload
      summary: Kiểm RLS và trạng thái clean rồi cấp URL ký HMAC hạn 120 giây
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "201":
          description: URL tương đối cùng origin, Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [ url, expires_at ]
                properties:
                  url: { type: string }
                  expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /attachments/{id}/content:
    get:
      operationId: downloadAttachment
      summary: Đọc tệp bằng capability ký, không nhận JWT trong URL
      security: []
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - in: query
          name: expires
          required: true
          schema: { type: string, pattern: '^[0-9]{10}$' }
        - in: query
          name: signature
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        "200":
          description: Bytes tải xuống, Content-Disposition attachment, nosniff, no-store
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /device-requests:
    get:
      operationId: listDeviceRequests
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Yêu cầu thiết bị theo quyền hiện tại
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DeviceRequest" }
                  limit: { type: integer }
                  offset: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createDeviceRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ device_type, reason ]
              properties:
                device_type: { type: string, enum: [ laptop, monitor, keyboard, mouse, other ] }
                reason: { type: string, minLength: 10, maxLength: 2000 }
                quantity: { type: integer, minimum: 1, maximum: 10, default: 1 }
      responses:
        "201":
          description: Yêu cầu thiết bị trạng thái pending; đơn vị lấy từ claim department của JWT
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /device-requests/{id}/handover-url:
    post:
      operationId: issueDeviceHandoverUrl
      summary: W5-03 — cấp URL ký tải biên bản bàn giao PDF (hạn 120 giây)
      description: Dành cho người đề nghị, người đã duyệt đề nghị và IT.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: URL ký; biên bản được tạo nếu chưa có
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /device-handovers/{id}/content:
    get:
      operationId: downloadDeviceHandover
      summary: W5-03 — tải biên bản bằng chữ ký ngắn hạn, không cần JWT
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: expires, in: query, required: true, schema: { type: string } }
        - { name: signature, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Tệp PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /teams:
    get:
      operationId: listTeams
      summary: Danh sách team và roster đang hoạt động; chỉ Agent/Manager
      responses:
        "200":
          description: "{data:[{id,name,active,members:[{user_id,display_name,active}]}]}"
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Team"
        "401": &a1
          $ref: "#/components/responses/Error"
        "403": *a1
  /tickets/{id}/claim:
    post:
      operationId: claimTicket
      summary: Agent thuộc team nhận phiếu assigned; cùng người retry 200, người khác 409
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      responses:
        "200":
          description: Giao dịch thành công; phản hồi sau durable commit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400": &a1
          $ref: "#/components/responses/Error"
        "401": *a1
        "403": *a1
        "404": *a1
        "409": *a1
        "422": *a1
        "503": *a1
  /system/events/{id}/process:
    post:
      operationId: processAutomationEvent
      summary: Xử lý event lưu trong outbox; callback lặp trả kết quả durable
      description: "Service JWT riêng: RS256, issuer/audience hợp lệ, role=ticket_automation, azp=dxdesk-automation, realm
        role ticket-automation; không nhận human token."
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                schema_version:
                  type: integer
                  enum:
                    - 1
              required:
                - schema_version
      responses:
        "200":
          description: Giao dịch thành công; phản hồi sau durable commit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationAck"
        "400": &a1
          $ref: "#/components/responses/Error"
        "401": *a1
        "403": *a1
        "404": *a1
        "409": *a1
        "422": *a1
        "503": *a1
  /system/sla/evaluate:
    post:
      operationId: evaluateSla
      summary: Đánh giá SLA và enqueue notice idempotent; không nhận clock từ client
      description: "Service JWT riêng: RS256, issuer/audience hợp lệ, role=ticket_automation, azp=dxdesk-automation, realm
        role ticket-automation; không nhận human token."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      responses:
        "200":
          description: Giao dịch thành công; phản hồi sau durable commit.
          content:
            application/json:
              schema:
                type: object
                required:
                  - queued
                properties:
                  queued:
                    type: integer
                    minimum: 0
        "400": &a1
          $ref: "#/components/responses/Error"
        "401": *a1
        "403": *a1
        "404": *a1
        "409": *a1
        "422": *a1
        "503": *a1
  /system/teams:
    get:
      operationId: automationTeams
      summary: Metadata team tối thiểu phục vụ provisioning roster
      description: "Service JWT riêng: RS256, issuer/audience hợp lệ, role=ticket_automation, azp=dxdesk-automation, realm
        role ticket-automation; không nhận human token."
      responses:
        "200":
          description: Giao dịch thành công; phản hồi sau durable commit.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Team"
        "400": &a1
          $ref: "#/components/responses/Error"
        "401": *a1
        "403": *a1
        "404": *a1
        "409": *a1
        "422": *a1
        "503": *a1
  /system/outbox:
    get:
      operationId: outboxStatus
      summary: pending/processing/failed/oldest_pending_at
      description: "Service JWT riêng: RS256, issuer/audience hợp lệ, role=ticket_automation, azp=dxdesk-automation, realm
        role ticket-automation; không nhận human token."
      responses:
        "200":
          description: Giao dịch thành công; phản hồi sau durable commit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxStatus"
        "400": &a1
          $ref: "#/components/responses/Error"
        "401": *a1
        "403": *a1
        "404": *a1
        "409": *a1
        "422": *a1
        "503": *a1
  /system/outbox/{id}/replay:
    post:
      operationId: replayOutbox
      summary: Chỉ đưa delivery failed về pending; không xóa inbox/audit
      description: "Service JWT riêng: RS256, issuer/audience hợp lệ, role=ticket_automation, azp=dxdesk-automation, realm
        role ticket-automation; không nhận human token."
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      responses:
        "200":
          description: Giao dịch thành công; phản hồi sau durable commit.
          content:
            application/json:
              schema:
                type: object
                required:
                  - replayed
                properties:
                  replayed:
                    type: boolean
        "400": &a1
          $ref: "#/components/responses/Error"
        "401": *a1
        "403": *a1
        "404": *a1
        "409": *a1
        "422": *a1
        "503": *a1
  /system/roster:
    post:
      operationId: syncRoster
      summary: Đồng bộ tối đa 100 thành viên có UUID Keycloak thật
      description: "Service JWT riêng: RS256, issuer/audience hợp lệ, role=ticket_automation, azp=dxdesk-automation, realm
        role ticket-automation; không nhận human token."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                members:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - team_id
                      - user_id
                      - display_name
                      - active
                    properties:
                      team_id:
                        type: string
                        format: uuid
                      user_id:
                        type: string
                        format: uuid
                      display_name:
                        type: string
                        minLength: 1
                        maxLength: 255
                      active:
                        type: boolean
              required:
                - members
      responses:
        "200":
          description: Giao dịch thành công; phản hồi sau durable commit.
          content:
            application/json:
              schema:
                type: object
                required:
                  - updated
                properties:
                  updated:
                    type: integer
                    minimum: 0
        "400": &a1
          $ref: "#/components/responses/Error"
        "401": *a1
        "403": *a1
        "404": *a1
        "409": *a1
        "422": *a1
        "503": *a1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak RS256, issuer realm dxdesk, audience dxdesk-api
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Offset:
      in: query
      name: offset
      schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
  responses:
    Error:
      description: Lỗi xác thực, quyền hoặc dữ liệu; 404 cũng được dùng khi RLS ẩn bản ghi
      content:
        application/json:
          schema:
            type: object
            properties:
              statusCode: { type: integer }
              message:
                oneOf:
                  - { type: string }
                  - { type: array, items: { type: string } }
  schemas:
    AssistantSession:
      type: object
      required: [id, title, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 100 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AssistantTurn:
      type: object
      required: [id, ordinal, question, answer, status, metadata, created_at]
      properties:
        id: { type: string, format: uuid }
        ordinal: { type: string }
        question: { type: string, maxLength: 8000 }
        answer: { type: string, maxLength: 16000 }
        status: { type: string, enum: [pending, complete, error, interrupted] }
        metadata: { type: object, description: Các bước xử lý và nguồn Wiki cùng đề xuất xác nhận nếu có }
        created_at: { type: string, format: date-time }
    LinkedDataResource:
      type: object
      required: ["@context", "@id", "@type", "schema:name", "schema:identifier"]
      properties:
        "@context": { type: object }
        "@id": { type: string, example: /ld/services/vpn }
        "@type": { type: string, enum: [ "schema:Service", "schema:DefinedTerm", "schema:Product" ] }
        "schema:name": { type: string }
        "schema:identifier": { type: string }
        "schema:description": { type: string }
    LinkedDataCatalog:
      type: object
      required: ["@context", "@id", "@type", "dct:title", "dcat:dataset"]
      properties:
        "@context": { type: object }
        "@id": { type: string, enum: [ /ld/catalog ] }
        "@type": { type: string, enum: [ "dcat:Catalog" ] }
        "dct:title": { type: string }
        "dct:modified": { type: object }
        "dcat:dataset":
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            required: ["@id", "@type", "dct:title", "dct:description", "dct:license", "dct:modified", "dcat:distribution"]
            properties:
              "@id": { type: string, example: "/ld/catalog#tickets" }
              "@type": { type: string, enum: [ "dcat:Dataset" ] }
              "dct:title": { type: string }
              "dct:description": { type: string }
              "dct:license": { type: object }
              "dct:modified": { type: object }
              "dcat:keyword": { type: string }
              "dcat:distribution": { type: object }
    Ticket:
      type: object
      properties:
        id: { type: string, format: uuid }
        requester_id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        priority: { type: string, enum: [ low, normal, high, critical ] }
        status:
          {
            type: string,
            enum: [ new, triaged, assigned, in_progress, waiting_user, pending_approval, resolved, closed, cancelled ]
          }
        assigned_to: { type: string, format: uuid, nullable: true }
        resolution_note: { type: string, nullable: true, minLength: 5, maxLength: 2000 }
        request_fields:
          type: object
          additionalProperties: { type: string }
        sla_due_at: { type: string, format: date-time, nullable: true }
        sla_paused_ms: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        assigned_team_id:
          type: string
          format: uuid
          nullable: true
        team_name:
          type: string
          nullable: true
        assignee_name:
          type: string
          nullable: true
        requester_name:
          type: string
          nullable: true
        ticket_version:
          type: integer
          format: int64
          minimum: 1
        sla_breached:
          type: boolean
        sla_breached_at:
          type: string
          format: date-time
          nullable: true
        waiting_since:
          type: string
          format: date-time
          nullable: true
    DeviceRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        requester_id: { type: string, format: uuid }
        device_type: { type: string, enum: [ laptop, monitor, keyboard, mouse, other ] }
        reason: { type: string }
        quantity: { type: integer }
        status:
          type: string
          enum: [ pending, approved, rejected, preparing, handed_over ]
          description: >-
            W5-02: pending -> approved -> preparing -> handed_over, hoặc pending -> rejected. Chỉ đổi qua
            PostgREST RPC transition_device_request; API này không có endpoint đổi trạng thái.
        department: { type: string, description: Mã đơn vị lấy từ claim department của JWT lúc tạo }
        decided_by: { type: string, format: uuid, nullable: true }
        decided_at: { type: string, format: date-time, nullable: true }
        decision_note: { type: string, nullable: true, maxLength: 2000 }
        prepared_by: { type: string, format: uuid, nullable: true }
        prepared_at: { type: string, format: date-time, nullable: true }
        handed_over_by: { type: string, format: uuid, nullable: true }
        handed_over_at: { type: string, format: date-time, nullable: true }
        handover_key: { type: string, nullable: true, description: Khóa tệp biên bản trong SeaweedFS (W5-03) }
        handover_generated_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Attachment:
      type: object
      properties:
        id: { type: string, format: uuid }
        ticket_id: { type: string, format: uuid }
        uploaded_by: { type: string, format: uuid }
        file_name: { type: string, maxLength: 255 }
        object_key:
          type: string
          description: "Key do server sinh: attachments/<ticket>/<uuid>"
        content_type: { type: string }
        size_bytes: { type: integer, minimum: 1, maximum: 10485760 }
        scan_status: { type: string, enum: [ pending, clean, infected, failed ] }
        created_at: { type: string, format: date-time }
    TicketEvent:
      type: object
      required:
        - id
        - ticket_id
        - actor_id
        - event_type
        - payload
        - created_at
        - actor_type
        - actor_name
      properties:
        id: &a2
          type: string
          format: uuid
        ticket_id: *a2
        actor_id: *a2
        event_type:
          type: string
          enum:
            - created
            - status_changed
            - assignment_changed
            - routing_unresolved
            - sla_warning
            - sla_breached
        payload:
          type: object
        created_at:
          type: string
          format: date-time
        actor_type:
          type: string
          enum:
            - user
            - system
            - ai
        actor_name:
          type: string
    Team:
      type: object
      required:
        - id
        - name
        - active
      properties:
        id: &a2
          type: string
          format: uuid
        name:
          type: string
        active:
          type: boolean
        members:
          type: array
          items:
            type: object
            required:
              - user_id
              - display_name
              - active
            properties:
              user_id: *a2
              display_name:
                type: string
              active:
                type: boolean
    AutomationAck:
      type: object
      required:
        - event_id
        - ticket_id
        - result
      properties:
        event_id: &a2
          type: string
          format: uuid
        ticket_id: *a2
        result:
          type: string
          enum:
            - routed
            - skipped
            - unresolved
            - notification
        status:
          type: string
        team_id:
          type: string
          format: uuid
          nullable: true
        notification:
          type: object
          required:
            - kind
            - team_id
          properties:
            kind:
              type: string
              enum:
                - assignment
                - status
                - sla_warning
                - sla_breached
            team_id:
              type: string
              format: uuid
              nullable: true
    OutboxStatus:
      type: object
      required:
        - pending
        - processing
        - failed
        - oldest_pending_at
      properties:
        pending:
          type: integer
          minimum: 0
        processing:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        oldest_pending_at:
          type: string
