server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml application/json image/svg+xml;

    # Health check for APISIX / container orchestrators
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Static assets with caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # W5-07 sample JSON-LD. Through APISIX, GET/HEAD /ld/* goes to the API (W5-04)
    # and only reaches this block for other methods (denied). Direct access to the
    # web container (no gateway) still serves the sample, marked by the header below.
    location ^~ /ld/ {
        limit_except GET { deny all; }
        types { }
        default_type application/ld+json;
        try_files $uri.json =404;
        add_header X-DXDesk-Catalog sample;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Browser path routing - SPA fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
